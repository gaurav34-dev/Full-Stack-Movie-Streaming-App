apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: default
  labels:
    app: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: magicstreammovies-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: server-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: magicstream-secrets
                  key: SECRET_KEY
            - name: SECRET_REFRESH_KEY
              valueFrom:
                secretKeyRef:
                  name: magicstream-secrets
                  key: SECRET_REFRESH_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: magicstream-secrets
                  key: OPENAI_API_KEY
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: magicstream-secrets
                  key: MONGODB_URI
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
